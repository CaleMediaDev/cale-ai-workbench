mcp_servers:
  localweb:
    command: '{{ROOT}}/Toolbox/python/Scripts/python.exe'
    args:
    - '{{ROOT}}/web_tools.py'
    timeout: 120
    sampling:
      enabled: false
  pages:
    command: '{{ROOT}}/Toolbox/node-v26.13.0-win-x64/node.exe'
    args:
    - '{{ROOT}}/Toolbox/node_modules/@playwright/mcp/cli.js'
    - --browser
    - chromium
    - --headless
    - --isolated
    - --no-webmcp
    - --output-dir
    - '{{ROOT}}/Browser-output'
    timeout: 120
    sampling:
      enabled: false
  toolbox:
    command: '{{ROOT}}/Toolbox/python/Scripts/python.exe'
    args:
    - '{{ROOT}}/toolbox_mcp.py'
    timeout: 1200
    sampling:
      enabled: false
  design:
    command: '{{ROOT}}/Toolbox/python/Scripts/python.exe'
    args:
    - '{{ROOT}}/design_tools.py'
    timeout: 120
    sampling:
      enabled: false
skills:
  disabled:
  - codex
  - claude-code
  - opencode
curator:
  enabled: false
tools:
  connectors:
    enabled: false
  tool_search:
    enabled: false
approvals:
  deny:
  - codex *
  - claude *
  - '*codex.exe*'
  - '*claude.exe*'
terminal:
  backend: local
  cwd: .
  timeout: 180
_config_version: 51
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
onboarding:
  seen:
    tool_progress_prompt: true
providers:
  local-ollama:
    api: http://127.0.0.1:11434/v1
    transport: chat_completions
    default_model: cale-local
    extra_body:
      temperature: 1.0
      top_p: 0.95
kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 30
  max_spawn: 1
  max_in_progress: 1
  max_in_progress_per_profile: 1
  failure_limit: 3
  review_dispatch: false
  reconcile_orphans: true
  dispatch_stale_timeout_seconds: 14400
  dispatch_profiles:
  - default
