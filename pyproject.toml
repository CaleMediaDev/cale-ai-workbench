[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["vendor/hermes-connector"]  # Preserve the upstream release source unchanged.

[tool.ruff.lint]
# Focus on correctness and readable imports. Long UI strings and task prompts
# are intentionally allowed to exceed the formatting width.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E402"]  # Validation scripts add the source folder to sys.path first.
